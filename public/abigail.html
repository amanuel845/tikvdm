<title>Abigail Downloader</title>
<style>
:root{--bg:#0f0f12;--bg2:#16161c;--bg3:#1c1c24;--bg4:#24242e;--border:#2a2a35;--fg:#e8e8ee;--fg2:#a0a0b0;--fg3:#6a6a78;--accent:#25f4ee;--warn:#f5a623;--err:#fe2c55;--ok:#33c48d}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;max-width:900px;margin:0 auto}
header{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg2)}
h1{margin:0 0 4px;font-size:15px;font-weight:700}
h1 b{color:var(--accent)}
.sub{color:var(--fg3);font-size:11.5px}
.body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 16px;gap:10px;overflow:auto}
.row{display:flex;gap:8px}
.btn{flex:1;padding:11px 14px;border-radius:6px;font-size:12px;font-weight:600;background:var(--bg3);border:1px solid var(--border);color:var(--fg);cursor:pointer}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#0f0f12}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.status{font-size:11.5px;color:var(--fg2);display:flex;justify-content:space-between;gap:10px}
.status .fail{color:var(--err)}
.status .ok{color:var(--ok)}
pre{flex:1;min-height:120px;margin:0;padding:10px;font:10.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--fg2);overflow:auto;white-space:pre-wrap;word-break:break-word}
.notice{padding:10px 12px;background:rgba(37,244,238,.06);border:1px solid rgba(37,244,238,.25);border-radius:6px;color:var(--accent);font-size:11.5px}
.notice code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg)}
</style>
</head>

  var $ = function (id) { return document.getElementById(id); };
  var startBtn    = $('startBtn');
  var stopBtn     = $('stopBtn');
  var barFill     = $('barFill');
  var statusText  = $('statusText');
  var statusCount = $('statusCount');
  var logEl       = $('log');

  var stopped = false;
  var count = Object.keys(DATA).length;

  $('count').textContent = count + ' videos · ' + (count * 2) + ' images · saves as abigail.zip';
  $('proxyLabel').textContent = PROXY_BASE;

  function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function setProgress(done, total, label) {
    var pct = total ? (done / total) * 100 : 0;
    barFill.style.width = pct.toFixed(1) + '%';
    statusText.textContent = label;
    statusCount.textContent = done + ' / ' + total;
  }

  function buildProxyUrl(upstream) {
    var u = PROXY_BASE + '?url=' + encodeURIComponent(upstream);
    if (PROXY_KEY) u += '&key=' + encodeURIComponent(PROXY_KEY);
    return u;
  }

  async function fetchImage(upstream) {
    var res = await fetch(buildProxyUrl(upstream), { redirect: 'follow' });
    if (!res.ok) {
      var body = await res.text().catch(function () { return ''; });
      throw new Error('HTTP ' + res.status + (body ? ' — ' + body.slice(0, 120) : ''));
    }
    return await res.blob();
  }

  async function run() {
    stopped = false;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    logEl.textContent = '';
    barFill.style.width = '0%';

    var zip = new JSZip();
    var coverFolder  = zip.folder('cover');
    var avatarFolder = zip.folder('avatars');

    var entries = Object.entries(DATA);
    var total = entries.length * 2;
    var done = 0, failed = 0;
    var t0 = Date.now();

    for (var i = 0; i < entries.length; i++) {
      if (stopped) { log('Stopped by user.'); break; }
      var id = entries[i][0];
      var urls = entries[i][1];

      try {
        var coverBlob = await fetchImage(urls.c);
        coverFolder.file(id + '_cover.jpeg', coverBlob);
        done++;
        setProgress(done, total, 'Cover ' + id);
      } catch (e) {
        failed++;
        log('FAIL cover ' + id + ': ' + e.message);
      }

      if (stopped) break;

      try {
        var avatarBlob = await fetchImage(urls.a);
        avatarFolder.file(id + '_avatar.jpeg', avatarBlob);
        done++;
        setProgress(done, total, 'Avatar ' + id);
      } catch (e) {
        failed++;
        log('FAIL avatar ' + id + ': ' + e.message);
      }

      await sleep(60);
    }

    if (failed > 0 && done === 0) {
      statusText.textContent = 'All requests failed — check the proxy';
      statusText.className = 'fail';
      log('\n0 images downloaded. Check the proxy URL and the Vercel logs.');
      startBtn.disabled = false;
      stopBtn.disabled = true;
      return;
    }

    statusText.textContent = 'Zipping…';
    var zipBlob = await zip.generateAsync(
      { type: 'blob', compression: 'STORE' },
      function (meta) {
        barFill.style.width = meta.percent.toFixed(1) + '%';
        statusCount.textContent = meta.percent.toFixed(0) + '%';
      }
    );

    var url = URL.createObjectURL(zipBlob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'abigail.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);

    var secs = ((Date.now() - t0) / 1000).toFixed(1);
    statusText.textContent = 'Done in ' + secs + 's';
    statusText.className = 'ok';
    log('\nFinished. ' + done + ' saved, ' + failed + ' failed.');
    log('abigail.zip — ' + (zipBlob.size / 1024 / 1024).toFixed(2) + ' MB');

    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  startBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', function () {
    stopped = true;
    stopBtn.disabled = true;
    statusText.textContent = 'Stopping…';
  });
})();
</script>
</body>
</html>
